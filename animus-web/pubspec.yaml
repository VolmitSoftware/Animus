name: animus_editor
description: "Browser editor for Animus NPCs, behaviors, shops, GUIs, rigs and animations."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.13.0

dependencies:
  web: ^1.1.1
  jaspr: ^0.23.1
  # Local checkout (or symlink) at .deps/arcane_jaspr; see tool/link_arcane_jaspr.sh.
  arcane_jaspr:
    path: .deps/arcane_jaspr
  arcane_jaspr_ascii:
    path: .deps/arcane_jaspr/packages/arcane_jaspr_ascii
  archive: ^4.0.2
  crypto: ^3.0.7
  # Citizens saves.yml parsing for the in-browser converter (lib/logic/citizens).
  yaml: ^3.1.3

dev_dependencies:
  build_daemon: 4.1.4 # pinned: jaspr_cli <-> build_runner protocol
  build_runner: 2.15.1
  build_web_compilers: ^4.4.18
  # Only tool/extract_minecraft_world_assets.dart decodes and packs PNGs.
  image: ^4.9.1
  jaspr_builder: ^0.23.1
  jaspr_cli: ^0.23.2
  lints: ^6.1.0
  test: ^1.25.0

# arcane_jaspr_ascii declares the hosted arcane_jaspr; the override keeps
# resolution on the local path checkout.
dependency_overrides:
  arcane_jaspr_shadcn:
    path: .deps/arcane_jaspr/packages/arcane_jaspr_shadcn
  arcane_jaspr:
    path: .deps/arcane_jaspr

jaspr:
  mode: client
  styles: standalone

scripts:
  serve: jaspr serve
  build: jaspr build
  clean: jaspr clean
