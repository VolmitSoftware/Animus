<!DOCTYPE html>
<html lang="en-US" dir="ltr" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Animus Editor</title>
  <meta name="description" content="Browser editor for Animus NPCs, behaviors, shops, GUIs, rigs and animations.">
  <meta id="animus-theme-color" name="theme-color" content="#0d0d0f">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script src="/bootstrap.js"></script>
  <link rel="preload" href="/assets/fonts/geist/Geist-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/geist/Geist-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles/01-foundations.css">
  <link rel="stylesheet" href="/styles/02-shell.css">
  <link rel="stylesheet" href="/styles/03-documents.css">
  <link rel="stylesheet" href="/styles/04-stage.css">
  <link rel="stylesheet" href="/styles/05-rig.css">
  <link rel="stylesheet" href="/styles/06-gui.css">
  <link rel="stylesheet" href="/styles/07-server.css">
  <link rel="stylesheet" href="/styles/08-inspect.css">
  <link rel="stylesheet" href="/styles/09-npcs.css">
  <link rel="stylesheet" href="/styles/10-combat.css">
  <link rel="stylesheet" href="/styles/11-offline.css">
</head>
<body>
  <div class="animus-boot" id="loading" role="status" aria-label="Loading the Animus editor">
    <img class="animus-boot-mark" src="/assets/brand/animus-mark.svg" width="72" height="72" alt="" fetchpriority="high">
    <div class="animus-boot-line" aria-hidden="true"><span></span></div>
    <p class="animus-boot-message" id="animus-boot-message"></p>
  </div>
  <div id="app"></div>
  <noscript>Animus Editor requires JavaScript.</noscript>
  <script defer src="/main.client.dart.js"></script>
</body>
</html>
