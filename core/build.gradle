import groovy.json.JsonOutput

plugins {
    id 'java-library'
}

ext.animusRoot = projectDir.parentFile
apply from: '../gradle/identity.gradle'
apply from: '../gradle/java.gradle'

if (rootProject.projectDir != animusRoot) {
    layout.buildDirectory.set(rootProject.layout.buildDirectory.dir('core'))
}

dependencies {
    api(project(':animus-api'))
    implementation('org.yaml:snakeyaml:2.5')
    implementation("com.github.VolmitSoftware.VolmLib:volmlib-localization:${animus.volmLibVersion}")
    // Director, the fleet's command framework. Only its classes ship; gradle/shadow.gradle drops the rest of the library.
    api("com.github.VolmitSoftware.VolmLib:volmlib-shared:${animus.volmLibVersion}") { transitive = false }
    api('net.kyori:adventure-text-minimessage:4.26.1')
    implementation('net.kyori:adventure-text-serializer-gson:4.26.1')
    testImplementation('org.junit.jupiter:junit-jupiter:5.10.2')
    testImplementation('net.kyori:adventure-text-serializer-plain:4.26.1')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher:1.10.2')
}

evaluationDependsOn(':animus-api')
def moduleContractJar = project(':animus-api').tasks.named('jar', Jar)
tasks.withType(Test).configureEach {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    dependsOn(moduleContractJar)
    inputs.file(moduleContractJar.flatMap { it.archiveFile })
    systemProperty('apiJar', moduleContractJar.get().archiveFile.get().asFile.absolutePath)
    File sharedSchemas = new File(animusRoot, 'schema')
    inputs.dir(sharedSchemas).withPropertyName('sharedSchemas')
    systemProperty('animusSchemaDirectory', sharedSchemas.absolutePath)
    // -Danimus.regenerateGolden=true rewrites schema/fixtures/citizens/expected (see CitizensGoldenTest).
    if (providers.systemProperty('animus.regenerateGolden').isPresent()) {
        systemProperty('animus.regenerateGolden', providers.systemProperty('animus.regenerateGolden').get())
        outputs.upToDateWhen { false }
    }
    if (providers.gradleProperty('moduleFixtureEvidence').isPresent()) {
        systemProperty('fixtureEvidence', providers.gradleProperty('moduleFixtureEvidence').get())
    }
}

Provider<Directory> identityDirectory = layout.buildDirectory.dir('generated/sources/identity')
tasks.register('generateBuildIdentity') {
    inputs.properties(animus)
    inputs.property('targets', minecraftTargets.keySet().toList())
    outputs.dir(identityDirectory)
    doLast {
        File output = identityDirectory.get().file('art/arcane/animus/core/BuildIdentity.java').asFile
        output.parentFile.mkdirs()
        output.setText("""package art.arcane.animus.core;

import java.util.List;

public final class BuildIdentity {
    public static final String ID = ${JsonOutput.toJson(animus.projectId)};
    public static final String NAME = ${JsonOutput.toJson(animus.projectName)};
    public static final String VERSION = ${JsonOutput.toJson(animus.projectVersion)};
    public static final List<String> MINECRAFT_VERSIONS = List.of(${minecraftTargets.keySet().collect { String target -> JsonOutput.toJson(target) }.join(', ')});

    private BuildIdentity() {
    }
}
""", 'UTF-8')
    }
}
sourceSets.main.java.srcDir(identityDirectory)

// The hand-written shared schemas ship inside the jar for GET /v1/schemas.
tasks.named('processResources', ProcessResources).configure {
    from(new File(animusRoot, 'schema')) {
        include '*.schema.json', 'gloss/*.schema.json'
        exclude 'editor-v1.schema.json'
        into 'animus/schema'
    }
}
tasks.named('compileJava').configure { dependsOn('generateBuildIdentity') }

// Rewrites VanillaAttributes.java from the server jar of every supported target, as Fabric Loom caches them. Build the
// Fabric jar of a target first if its server jar is missing.
tasks.register('generateAttributeTable', Exec) {
    group = 'build'
    description = 'Writes the vanilla attribute table from the supported server jars.'
    File loom = new File(gradle.gradleUserHomeDir, 'caches/fabric-loom')
    List<String> arguments = [javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }.get().executablePath.asFile.absolutePath,
        file('tool/AttributeTableGenerator.java').absolutePath, file('src/main/java/art/arcane/animus/core/npc/VanillaAttributes.java').absolutePath]
    minecraftTargets.keySet().each { String target ->
        arguments.add("${target}=${new File(loom, "${target}/minecraft-extracted_server.jar").absolutePath}".toString())
    }
    commandLine(arguments)
}
