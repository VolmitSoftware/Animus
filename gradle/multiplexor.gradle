gradle.projectsEvaluated {
    File bukkitArchive = project(':bukkit').tasks.named('packedJar').get().outputJar.get().asFile
    Jar apiArchive = project(':animus-api').tasks.named('jar', Jar).get()
    // These are pure build/check targets. Managed-server scenarios live in qa/multiplexor/.
    List<Map<String, Object>> targets = [[
        id: 'core',
        tasks: [':animus-api:build', ':core:check'],
        arguments: [],
        java: 25,
        memoryMiB: 4096,
        workers: 2,
        dependsOn: [],
        artifacts: [[path: relativePath(apiArchive.archiveFile.get().asFile), role: 'api', platforms: [], minecraftVersions: []]]
    ], [
        id: 'bukkit',
        tasks: [':bukkit:build'],
        arguments: [],
        java: 25,
        memoryMiB: 4096,
        workers: 2,
        dependsOn: ['animus:core'],
        artifacts: [[
            path: relativePath(bukkitArchive),
            role: 'runtime',
            platforms: ['plugin'],
            minecraftVersions: minecraftTargets.keySet().toList()
        ]]
    ], [
        id: 'converter',
        tasks: [':converter:build'],
        arguments: [],
        java: 25,
        memoryMiB: 4096,
        workers: 2,
        dependsOn: ['animus:core'],
        artifacts: []
    ]]
    minecraftTargets.keySet().each { String target ->
        targets.add([
            id: "bukkit-api-${target}".toString(),
            tasks: [":bukkit:compileSpigot${target.replace('.', '_')}".toString()],
            arguments: [],
            java: 25,
            memoryMiB: 4096,
            workers: 2,
            dependsOn: ['animus:core'],
            artifacts: []
        ])
    }
    for (String loader : ['fabric', 'forge', 'neoforge']) {
        minecraftTargets.each { String minecraft, Map<String, Object> properties ->
            if (loader == 'neoforge' && properties.neoforgeUsesForge) {
                return
            }
            String platform = [fabric: 'Fabric', forge: 'Forge', neoforge: 'NeoForge'][loader]
            String loaderVersion = loader == 'fabric' ? properties.fabricLoader : properties[loader]
            String displayVersion = loaderVersion.startsWith(minecraft + '-')
                    ? loaderVersion.substring(minecraft.length() + 1) : loaderVersion
            displayVersion = displayVersion.replaceFirst(/-beta$/, '')
            List<String> arguments = ['-p', "adapters/${loader}".toString(), "-PminecraftVersion=${minecraft}".toString()]
            animus.each { String key, String value ->
                if (key != 'minecraftVersion') {
                    arguments.add("-P${key}=${value}".toString())
                }
            }
            targets.add([
                id: "${loader}-${minecraft}".toString(),
                tasks: [':build'],
                arguments: arguments,
                java: 25,
                memoryMiB: 4096,
                workers: 2,
                dependsOn: ['animus:core'],
                artifacts: [[
                    path: "adapters/${loader}/build/${minecraft}/libs/${animus.projectName} v${version} [${platform}] ${minecraft}+${displayVersion}.jar".toString(),
                    role: 'runtime',
                    platforms: loader == 'forge' && properties.neoforgeUsesForge ? ['forge', 'neoforge'] : [loader],
                    minecraftVersions: [minecraft]
                ]]
            ])
        }
    }
    rootProject.ext.multiplexor = [
        schema: 1,
        id: 'animus',
        name: animus.projectName,
        sandbox: 'per-target',
        parallelTargets: true,
        sourceDependencies: ['volmlib'],
        targets: targets
    ]
}
