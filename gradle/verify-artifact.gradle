import groovy.json.JsonSlurper
import java.nio.charset.StandardCharsets
import java.util.jar.JarEntry
import java.util.jar.JarFile
import java.util.jar.JarInputStream
import java.util.regex.Matcher
import java.util.regex.Pattern

String platform = project.name == 'bukkit' ? 'bukkit' : projectDir.name
Map<String, String> metadataPaths = [bukkit: 'plugin.yml', fabric: 'fabric.mod.json', forge: 'META-INF/mods.toml', neoforge: 'META-INF/neoforge.mods.toml']
Map<String, String> entrypoints = [bukkit: "${animus.projectGroup}.bukkit.AnimusPlugin", fabric: "${animus.projectGroup}.fabric.AnimusFabric", forge: "${animus.projectGroup}.forge.AnimusForge", neoforge: "${animus.projectGroup}.neoforge.AnimusNeoForge"]
TaskProvider verification = tasks.register('verifyArtifact') {
    group = 'verification'
    description = 'Checks runtime metadata, bundled libraries and platform boundaries.'
    Provider<RegularFile> artifactFile = providers.provider { project.ext.distributionJar }.flatMap { Provider<RegularFile> selected -> selected }
    dependsOn(artifactFile)
    inputs.file(artifactFile)
    inputs.properties(animus)
    inputs.property('minecraftTargets', minecraftTargets)
    // Spigot and Paper supply the Bukkit jar's Gson and SnakeYAML, so the command tree check below loads the oldest they ship.
    Configuration serverLibraries = project.configurations.detachedConfiguration()
    serverLibraries.transitive = false
    if (platform == 'bukkit') {
        oldestServerLibraries.each { String notation -> serverLibraries.dependencies.add(project.dependencies.create(notation)) }
    }
    inputs.files(serverLibraries).withPropertyName('serverLibraries')
    doLast {
        File artifact = artifactFile.get().asFile
        Closure<Void> require = { boolean condition, String message ->
            if (!condition) {
                throw new GradleException("${artifact.name}: ${message}")
            }
            null
        }
        // A class file's constant pool: every text in it, and the strings ldc loads, such as a class name passed to Class.forName.
        Closure<Map<String, Object>> constantPool = { byte[] bytecode ->
            DataInputStream input = new DataInputStream(new ByteArrayInputStream(bytecode))
            input.skipBytes(8)
            int count = input.readUnsignedShort()
            Map<Integer, String> texts = [:]
            List<Integer> strings = []
            for (int index = 1; index < count; index++) {
                int tag = input.readUnsignedByte()
                switch (tag) {
                    case 1: texts[index] = input.readUTF(); break
                    case 8: strings.add(input.readUnsignedShort()); break
                    case [7, 16, 19, 20]: input.skipBytes(2); break
                    case 15: input.skipBytes(3); break
                    case [3, 4, 9, 10, 11, 12, 17, 18]: input.skipBytes(4); break
                    case [5, 6]: input.skipBytes(8); index++; break
                    default: throw new GradleException("${artifact.name}: unknown constant pool tag ${tag}")
                }
            }
            [texts: texts.values(), strings: strings.collect { Integer index -> texts[index] }]
        }
        String metadataPath = metadataPaths[platform]
        String entrypoint = entrypoints[platform]
        String namespace = animus.projectGroup.replace('.', '/') + '/'
        String internal = namespace + 'internal/'
        Map<String, Object> target = minecraftTargets[animus.minecraftVersion]
        new JarFile(artifact).withCloseable { JarFile archive ->
            boolean versionedEntries = archive.entries().any { JarEntry entry -> !entry.directory && entry.name.startsWith('META-INF/versions/') }
            // SnakeYAML's logger is the only versioned entry, and the Bukkit jar leaves SnakeYAML to the server; its unused flag is harmless.
            require(archive.isMultiRelease() || !versionedEntries, 'versioned archive entries need a multi-release manifest')
            List<String> required = [metadataPath, entrypoint.replace('.', '/') + '.class',
                namespace + 'core/AnimusRuntime.class', namespace + 'core/BuildIdentity.class',
                'art/arcane/animus/api/AnimusApi.class', 'art/arcane/animus/api/TrustedModule.class',
                internal + 'volmlib/util/config/ConfigJson.class', internal + 'volmlib/util/director/runtime/DirectorRuntimeEngine.class',
                internal + 'volmlib/util/director/help/DirectorMiniMenu.class']
            if (platform != 'bukkit') {
                required.add(internal + 'gson/Gson.class')
                // The Bukkit shrink drops AtomicFileIO: only VolmLib's language file editors use it and Animus calls neither.
                required.add(internal + 'volmlib/util/io/AtomicFileIO.class')
                required.add(namespace + 'mod/AnimusModRuntime.class')
                required.add(namespace + 'mod/MinecraftVersion.class')
            }
            required.each { String path -> require(archive.getEntry(path) != null, "missing ${path}") }
            if (namespace != 'art/arcane/animus/') {
                require(archive.entries().every { JarEntry entry -> !entry.name.startsWith(namespace + 'api/') }, 'public API must keep its stable package')
            }
            (metadataPaths.values() + ['paper-plugin.yml']).findAll { String path -> path != metadataPath }.each { String path ->
                require(archive.getEntry(path) == null, "contains foreign platform metadata ${path}")
            }
            // Libraries the server provides that this jar also bundles under internal/: Paper's Adventure on Bukkit and
            // Minecraft's Gson on the mod loaders. The Bukkit jar bundles no Gson or SnakeYAML; Spigot and Paper ship both.
            Closure<List<String>> internalNames = { List<String> libraries -> libraries.collectMany { String library -> [internal + library + '/', internal.replace('/', '.') + library + '.'] } }
            List<String> relocatedServerNames = internalNames(platform == 'bukkit' ? ['kyori'] : ['gson'])
            List<String> unbundledNames = platform == 'bukkit' ? internalNames(['gson', 'snakeyaml']) : []
            List<String> unrelocatedLibraries = platform == 'bukkit' ? ['art/arcane/volmlib/'] : ['art/arcane/volmlib/', 'com/google/gson/']
            Set<String> classes = new HashSet<>()
            List<String> forbidden = ['org/bukkit/', 'org/spigotmc/', 'io/papermc/', 'net/minecraft/',
                'com/mojang/', 'net/minecraftforge/', 'net/neoforged/', 'net/fabricmc/', 'art/arcane/volmlib/', 'com/google/gson/', 'org/yaml/snakeyaml/', 'org/bstats/']
            archive.entries().each { JarEntry entry ->
                if (!entry.name.endsWith('.class')) {
                    return
                }
                require(classes.add(entry.name), "duplicate class ${entry.name}")
                String classPath = entry.name.replaceFirst('^META-INF/versions/[0-9]+/', '')
                require(!forbidden.any { String prefix -> classPath.startsWith(prefix) }, "bundled platform or unrelocated library class ${entry.name}")
                // A class name in a string is meant for the server's own copy of a library it shares with this jar; Shadow
                // relocates it like the bundled copy, and the lookup then finds the bundled class instead of the server's.
                archive.getInputStream(entry).withCloseable { InputStream stream ->
                    byte[] bytecode = stream.readAllBytes()
                    Map<String, Object> pool = constantPool(bytecode)
                    String relocated = pool.strings.find { String text -> relocatedServerNames.any { String name -> text.contains(name) } }
                    require(relocated == null, "${entry.name} names ${relocated}, a relocated class the server provides; resolve the server's class from a type it returns")
                    // Attribute names sit in the pool only while an attribute uses them.
                    Collection<String> texts = pool.texts
                    require(!texts.contains('LocalVariableTable') && !texts.contains('LocalVariableTypeTable'), "${entry.name} keeps local variable tables")
                    require(platform != 'bukkit' || !texts.contains('MethodParameters'), "${entry.name} keeps parameter names")
                    boolean own = classPath.startsWith(namespace) && !classPath.startsWith(internal)
                    require(!own || !texts.contains('Code') || texts.contains('LineNumberTable') && texts.contains('SourceFile'),
                        "${entry.name} lost the line numbers or source file its stack traces need")
                    String constants = new String(bytecode, StandardCharsets.ISO_8859_1)
                    String missing = unbundledNames.find { String name -> constants.contains(name) }
                    require(missing == null, "${entry.name} names ${missing}, a relocated library this jar does not bundle")
                }
                if (classPath.startsWith(namespace) && !classPath.startsWith(internal)) {
                    archive.getInputStream(entry).withCloseable { InputStream stream ->
                        byte[] bytecode = stream.readAllBytes()
                        DataInputStream bytes = new DataInputStream(new ByteArrayInputStream(bytecode))
                        require(bytes.readInt() == -889275714, "invalid class file ${entry.name}")
                        bytes.readUnsignedShort()
                        int javaVersion = platform == 'bukkit' || classPath.startsWith(namespace + 'core/') ? 25 : (int) target.javaVersion
                        require(bytes.readUnsignedShort() == javaVersion + 44, "${entry.name} must target Java ${javaVersion}")
                        String constants = new String(bytecode, StandardCharsets.ISO_8859_1)
                        require(!unrelocatedLibraries.any { String library -> constants.contains(library) }, "unrelocated library reference in ${entry.name}")
                        if (platform == 'forge' && (classPath == namespace + 'mod/AnimusModRuntime.class' || classPath == namespace + 'mod/MinecraftVersion.class')) {
                            boolean srgReferences = Pattern.compile('m_[0-9]+_').matcher(constants).find()
                            require(srgReferences == (target.forgeRuntimeMappings == 'srg'), "incorrect Forge runtime mappings in ${entry.name}")
                        }
                        if (platform == 'fabric' && target.obfuscated && classPath.startsWith(namespace + 'mod/')) {
                            require(!constants.contains('net/minecraft/SharedConstants') && !constants.contains('net/minecraft/commands/CommandSourceStack'), "unmapped Minecraft reference in ${entry.name}")
                            if (classPath == namespace + 'mod/AnimusModRuntime.class' || classPath == namespace + 'mod/MinecraftVersion.class') {
                                require(constants.contains('net/minecraft/class_'), "missing intermediary Minecraft references in ${entry.name}")
                            }
                        }
                    }
                }
            }
            String metadata = archive.getInputStream(archive.getJarEntry(metadataPath)).withCloseable { InputStream stream -> stream.getText('UTF-8') }
            require(!metadata.contains('${'), "unexpanded properties in ${metadataPath}")
            if (platform == 'fabric') {
                Map<String, Object> parsed = (Map<String, Object>) new JsonSlurper().parseText(metadata)
                require(parsed.id == animus.projectId && parsed.name == animus.projectName && parsed.version == animus.projectVersion, 'Fabric identity does not match build properties')
                require(parsed.environment == '*' && parsed.entrypoints == [main: [entrypoint]], 'incorrect Fabric entrypoints or environment')
                require(parsed.depends instanceof Map && parsed.jars instanceof List, 'missing Fabric runtime requirements or nested jar declarations')
                require(parsed.depends.minecraft == animus.minecraftVersion && parsed.depends.fabricloader == ">=${target.fabricLoader}" && parsed.depends.java == ">=${target.javaVersion}", 'incorrect Fabric runtime requirements')
                List<String> modules = ['fabric-api-base', 'fabric-command-api-v2', 'fabric-lifecycle-events-v1']
                Set<String> expected = modules.collect { String module -> "META-INF/jars/${module}.jar".toString() }.toSet()
                List<String> declared = ((List<Map<String, String>>) parsed.jars).collect { Map<String, String> nested -> nested.file }
                Set<String> bundled = archive.entries().findAll { JarEntry entry -> entry.name.startsWith('META-INF/jars/') && entry.name.endsWith('.jar') }.collect { JarEntry entry -> entry.name }.toSet()
                require(declared.size() == modules.size() && declared.toSet() == expected && bundled == expected, 'Fabric nested jars must contain exactly the base, command and lifecycle modules')
                modules.each { String module ->
                    Map<String, Object> nestedMetadata = null
                    new JarInputStream(archive.getInputStream(archive.getJarEntry("META-INF/jars/${module}.jar"))).withCloseable { JarInputStream nested ->
                        JarEntry nestedEntry
                        while ((nestedEntry = nested.nextJarEntry) != null) {
                            if (nestedEntry.name == 'fabric.mod.json') {
                                nestedMetadata = (Map<String, Object>) new JsonSlurper().parseText(new String(nested.readAllBytes(), StandardCharsets.UTF_8))
                                break
                            }
                        }
                    }
                    require(nestedMetadata != null && nestedMetadata.id == module && nestedMetadata.version == target.fabricModules[module], "incorrect nested Fabric module ${module}")
                }
            } else if (platform == 'bukkit') {
                Map<String, String> fields = [:]
                metadata.eachLine { String line ->
                    Matcher match = (line =~ /^([a-z-]+):\s*(.*?)\s*$/)
                    if (match.matches()) {
                        fields[match.group(1)] = match.group(2).replaceAll(/^['"]|['"]$/, '')
                    }
                }
                require(fields.name == animus.projectName && fields.version == animus.projectVersion && fields.main == entrypoint, 'Bukkit identity does not match build properties')
                require(fields['api-version'] == '26.1.2' && fields['folia-supported'] == 'true', 'incorrect Bukkit API or Folia declaration')
                require(Pattern.compile('(?m)^  ' + Pattern.quote(animus.projectId) + ':\\s*$').matcher(metadata).find(), 'missing configured Bukkit command')
            } else {
                Closure<List<Map<String, String>>> sections = { String section ->
                    List<Map<String, String>> matches = []
                    Matcher blocks = Pattern.compile('(?ms)^\\[\\[' + Pattern.quote(section) + '\\]\\]\\s*\\n(.*?)(?=^\\[|\\z)').matcher(metadata)
                    while (blocks.find()) {
                        Map<String, String> fields = [:]
                        Matcher values = Pattern.compile('(?m)^\\s*([A-Za-z][A-Za-z0-9]*)\\s*=\\s*"([^"\\r\\n]*)"\\s*$').matcher(blocks.group(1))
                        while (values.find()) {
                            fields[values.group(1)] = values.group(2)
                        }
                        matches.add(fields)
                    }
                    matches
                }
                List<Map<String, String>> mods = sections('mods')
                require(mods.size() == 1 && mods[0].modId == animus.projectId && mods[0].version == animus.projectVersion && mods[0].displayName == animus.projectName, 'mod identity does not match build properties')
                List<Map<String, String>> dependencies = sections('dependencies.' + animus.projectId)
                Map<String, String> minecraft = dependencies.find { Map<String, String> dependency -> dependency.modId == 'minecraft' }
                Map<String, String> loader = dependencies.find { Map<String, String> dependency -> dependency.modId == platform }
                require(minecraft != null && minecraft.versionRange == "[${animus.minecraftVersion}]" && minecraft.side == 'BOTH', 'incorrect Minecraft dependency range')
                String loaderRange = platform == 'forge' ? target.forgeLoaderRange : "[${target.neoforge},)"
                require(loader != null && loader.versionRange == loaderRange && loader.side == 'BOTH', 'incorrect mod loader dependency range')
                String fmlRange = platform == 'forge' ? target.forgeLoaderRange : '[3,)'
                require(Pattern.compile('(?m)^modLoader\\s*=\\s*"javafml"\\s*$').matcher(metadata).find(), 'missing Java FML loader declaration')
                require(Pattern.compile('(?m)^loaderVersion\\s*=\\s*"' + Pattern.quote(fmlRange) + '"\\s*$').matcher(metadata).find(), 'incorrect FML loader range')
                if (platform == 'forge') {
                    // Forge reads every mod jar as a data pack and logs "Missing data pack" for one without metadata.
                    JarEntry packEntry = archive.getJarEntry('pack.mcmeta')
                    require(packEntry != null, 'missing pack.mcmeta that Forge reads as the mod data pack')
                    Map<String, Object> pack = (Map<String, Object>) new JsonSlurper().parseText(archive.getInputStream(packEntry).withCloseable { InputStream stream -> stream.getText('UTF-8') }).pack
                    require(pack instanceof Map && pack.description instanceof String && pack.min_format == target.dataPackFormat && pack.max_format == target.dataPackFormat, "pack.mcmeta must declare data pack format ${target.dataPackFormat}")
                }
                if (platform == 'neoforge') {
                    String javaRange = "[${target.javaVersion},)"
                    require(Pattern.compile('(?ms)^\\[features\\.' + Pattern.quote(animus.projectId) + '\\]\\s*\\n(?:(?!^\\[).)*?^javaVersion\\s*=\\s*"' + Pattern.quote(javaRange) + '"\\s*$').matcher(metadata).find(), 'incorrect NeoForge Java requirement')
                }
            }
        }
        URL[] locations = ([artifact] + serverLibraries.files).collect { File file -> file.toURI().toURL() } as URL[]
        new URLClassLoader(locations, ClassLoader.getPlatformClassLoader()).withCloseable { URLClassLoader isolated ->
            Class<?> identity = Class.forName(animus.projectGroup + '.core.BuildIdentity', true, isolated)
            [ID: animus.projectId, NAME: animus.projectName, VERSION: animus.projectVersion].each { String field, String expected ->
                require(identity.getField(field).get(null) == expected, "BuildIdentity.${field} does not match build properties")
            }
            require(identity.getField('MINECRAFT_VERSIONS').get(null) == minecraftTargets.keySet().toList(), 'BuildIdentity Minecraft targets do not match the manifest')
            // The command tree builds and renders its help from the jar alone, without a server, so no needed Director class was filtered out.
            Class<?> commands = Class.forName(animus.projectGroup + '.core.command.AnimusCommandTree', true, isolated)
            require(((Integer) commands.getMethod('selfCheck').invoke(null)) > 10, 'the /animus command tree did not build from the jar')
        }
    }
}
tasks.named('check').configure { dependsOn(verification) }
