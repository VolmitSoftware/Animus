name: '${projectName}'
version: '${projectVersion}'
main: ${projectGroup}.bukkit.AnimusPlugin
description: 'NPCs that act alive instead of being fake players.'
authors: [Volmit Software]
api-version: '${apiVersion}'
folia-supported: true
commands:
  ${projectId}:
    description: Manages definitions and staged Citizens imports.
    usage: '/<command> [status|list|create|inspect|edit|clone|delete|validate|reload|import|rollback]'

permissions:
  animus.status:
    description: View Animus status.
    default: true
  animus.admin:
    description: Manage definitions, imports, and backups.
    default: op
