name: '${projectName}'
version: '${projectVersion}'
main: ${projectGroup}.bukkit.AnimusPlugin
description: 'A Manager for all things NPC.'
authors: [Volmit Software]
api-version: '${apiVersion}'
folia-supported: true
commands:
  ${projectId}:
    description: Manages virtual NPCs, definitions and staged Citizens imports.
    usage: '/<command> [status|list|create|select|inspect|edit|clone|delete|spawn|despawn|navigate|navigation|look|ride|attack|target|combat|proof|modules|behaviors|validate|reload|import|rollback]'

permissions:
  animus.status:
    description: View Animus status.
    default: true
  animus.ride:
    description: Ride NPCs whose definition opts in with the animus:riding module. A definition may name its own node instead.
    default: op
  animus.admin:
    description: Manage NPCs, movement, combat, modules, behaviors, imports, and backups.
    default: op
