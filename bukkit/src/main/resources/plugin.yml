name: '${projectName}'
version: '${projectVersion}'
main: ${projectGroup}.bukkit.AnimusPlugin
description: 'A Manager for all things NPC.'
authors: [Volmit Software]
api-version: '${apiVersion}'
folia-supported: true
softdepend: [WorldGuard, Vault, Gloss, React]
commands:
  ${projectId}:
    description: Manages virtual NPCs, definitions and staged Citizens imports.
    usage: '/<command> help'

permissions:
  animus.status:
    description: View Animus status.
    default: true
  animus.ride:
    description: Ride NPCs whose definition opts in with the animus:riding module. A definition may name its own node instead.
    default: op
  animus.build.donate:
    description: Donate held items to an NPC build that takes donations.
    default: true
  animus.debug:
    description: Read Animus network and performance diagnostics with /animus debug.
    default: op
  animus.debug.mode:
    description: Switch /animus debug mode, which logs every per-NPC route, spawn and packet diagnostic until restart.
    default: op
  animus.admin:
    description: Manage NPCs, movement, combat, builds, modules, behaviors, imports, and backups.
    default: op
  animus.hotload.notify:
    description: Hear the ding and see each change when a data file is hotloaded or refused.
    default: op
  animus.editor.notify:
    description: Hear the sound and see who changed what when the web editor applies, undoes, imports, spawns, pairs or is refused.
    default: op
