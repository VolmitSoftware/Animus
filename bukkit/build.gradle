plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.5.1'
}

ext.animusRoot = projectDir.parentFile
apply from: '../gradle/identity.gradle'
apply from: '../gradle/java.gradle'
apply from: '../gradle/shadow.gradle'
apply from: '../gradle/verify-artifact.gradle'

repositories {
    maven { url = uri('https://hub.spigotmc.org/nexus/content/repositories/snapshots/') }
    maven {
        url = uri('https://maven.enginehub.org/repo/')
        content { includeGroup('com.sk89q.worldguard'); includeGroup('com.sk89q.worldedit') }
    }
}
configurations { packetApi; protectionApi { transitive = false } }
configurations.compileOnly.extendsFrom(configurations.packetApi, configurations.protectionApi)
dependencies {
    compileOnly('org.spigotmc:spigot-api:26.1.2-R0.1-SNAPSHOT')
    packetApi('io.netty:netty-transport:4.2.16.Final')
    protectionApi('com.sk89q.worldguard:worldguard-core:7.0.14')
    protectionApi('com.sk89q.worldguard:worldguard-bukkit:7.0.14')
    protectionApi('com.sk89q.worldedit:worldedit-core:7.3.15')
    protectionApi('com.sk89q.worldedit:worldedit-bukkit:7.3.15')
    testImplementation('org.junit.jupiter:junit-jupiter:5.10.2')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher:1.10.2')
    testImplementation('org.spigotmc:spigot-api:26.1.2-R0.1-SNAPSHOT')
    testRuntimeOnly('io.netty:netty-transport:4.2.16.Final')
}
tasks.named('processResources').configure {
    inputs.properties(animus + [apiVersion: '26.1.2'])
    filesMatching('plugin.yml') { expand(animus + [apiVersion: '26.1.2']) }
}
tasks.named('shadowJar').configure {
    archiveFileName.set("${animus.projectName} v${version} [CraftBukkit] ${minecraftTargets.keySet().first()}-${minecraftTargets.keySet().last()}.jar")
}

minecraftTargets.keySet().each { String target ->
    String suffix = target.replace('.', '_')
    Configuration targetApi = configurations.create("spigot${suffix}")
    dependencies.add(targetApi.name, "org.spigotmc:spigot-api:${target}-R0.1-SNAPSHOT")
    TaskProvider<JavaCompile> compatibility = tasks.register("compileSpigot${suffix}", JavaCompile) {
        source = sourceSets.main.java
        classpath = targetApi + configurations.bundle + configurations.packetApi + configurations.protectionApi
        destinationDirectory.set(layout.buildDirectory.dir("compatibility/${target}"))
        dependsOn(':core:jar')
    }
    tasks.named('check').configure { dependsOn(compatibility) }
}
