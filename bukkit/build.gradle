plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.5.1'
}

ext.animusRoot = projectDir.parentFile
apply from: '../gradle/identity.gradle'
apply from: '../gradle/java.gradle'
apply from: '../gradle/shadow.gradle'
apply from: '../gradle/verify-artifact.gradle'

repositories {
    maven { url = uri('https://hub.spigotmc.org/nexus/content/repositories/snapshots/') }
    maven {
        url = uri('https://maven.enginehub.org/repo/')
        content { includeGroup('com.sk89q.worldguard'); includeGroup('com.sk89q.worldedit'); includeGroup('com.sk89q.worldedit.worldedit-libs'); includeGroup('com.sk89q.worldguard.worldguard-libs') }
    }
    maven {
        url = uri('https://repo.papermc.io/repository/maven-public/')
        content { includeGroup('io.papermc.paper'); includeGroup('com.mojang'); includeVersionByRegex('net\\.md-5', 'bungeecord-chat', '.*-deprecated.*') }
    }
}
configurations { packetApi; protectionApi; economyApi; commandApi }
configurations.compileOnly.extendsFrom(configurations.packetApi, configurations.protectionApi, configurations.economyApi, configurations.commandApi)
// Paper's client command tree uses Brigadier; Paper and Spigot servers both ship it.
configurations.testImplementation.extendsFrom(configurations.commandApi)
// WorldGuard's own flag resolution checks how protection/WorldGuardRegionFlags asks about NPCs.
configurations.testImplementation.extendsFrom(configurations.protectionApi)
dependencies {
    compileOnly('org.spigotmc:spigot-api:26.1.2-R0.1-SNAPSHOT')
    packetApi('io.netty:netty-transport:4.2.16.Final')
    protectionApi('com.sk89q.worldguard:worldguard-core:7.0.14') { transitive = false }
    protectionApi('com.sk89q.worldguard:worldguard-bukkit:7.0.14') { transitive = false }
    protectionApi('com.sk89q.worldedit:worldedit-core:7.3.15') { transitive = false }
    protectionApi('com.sk89q.worldedit:worldedit-bukkit:7.3.15') { transitive = false }
    economyApi('com.github.MilkBowl:VaultAPI:1.7.1') { transitive = false }
    commandApi('com.mojang:brigadier:1.3.10')
    bundle('org.bstats:bstats-bukkit:3.2.1')
    testImplementation('org.junit.jupiter:junit-jupiter:5.10.2')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher:1.10.2')
    testImplementation('org.spigotmc:spigot-api:26.1.2-R0.1-SNAPSHOT')
    testRuntimeOnly('io.netty:netty-transport:4.2.16.Final')
    testRuntimeOnly('com.sk89q.worldedit.worldedit-libs:core:7.3.15') { transitive = false }
    testRuntimeOnly('com.sk89q.worldguard.worldguard-libs:core:7.0.14') { transitive = false }
}
tasks.named('processResources').configure {
    inputs.properties(animus + [apiVersion: '26.1.2'])
    filesMatching('plugin.yml') { expand(animus + [apiVersion: '26.1.2']) }
}
tasks.named('shadowJar').configure {
    archiveFileName.set("${animus.projectName} v${version} [CraftBukkit] ${minecraftTargets.keySet().first()}-${minecraftTargets.keySet().last()}.jar")
    // bStats refuses to enable from its own package.
    relocate('org.bstats', "${animus.projectGroup}.internal.bstats")
}

// The Paper API build each target's linkage is checked against; the APIs differ and the plugin compiles against Spigot.
Map<String, String> paperApiBuilds = ['26.1.2': '26.1.2.build.74-stable', '26.2': '26.2.build.135-stable', '26.3': '26.3.build.244-stable']
Map<String, Configuration> apiTargets = [:]
minecraftTargets.keySet().each { String target ->
    String suffix = target.replace('.', '_')
    Configuration targetApi = configurations.create("spigot${suffix}")
    dependencies.add(targetApi.name, "org.spigotmc:spigot-api:${target}-R0.1-SNAPSHOT")
    if (!paperApiBuilds.containsKey(target)) throw new GradleException("No Paper API build is pinned for Minecraft ${target}")
    Configuration paperApi = configurations.create("paper${suffix}")
    dependencies.add(paperApi.name, "io.papermc.paper:paper-api:${paperApiBuilds[target]}")
    apiTargets["spigot-${target}".toString()] = targetApi
    apiTargets["paper-${target}".toString()] = paperApi
    TaskProvider<JavaCompile> compatibility = tasks.register("compileSpigot${suffix}", JavaCompile) {
        source = sourceSets.main.java
        classpath = targetApi + configurations.bundle + configurations.packetApi + configurations.protectionApi + configurations.economyApi + configurations.commandApi
        destinationDirectory.set(layout.buildDirectory.dir("compatibility/${target}"))
        dependsOn(':core:jar')
    }
    tasks.named('check').configure { dependsOn(compatibility) }
}

// ServerApiLinkageTest resolves every server member the shipped jar names against each target's API jars.
tasks.named('test', Test).configure {
    inputs.file(distributionJar).withPropertyName('pluginJar')
    apiTargets.each { String name, Configuration api -> inputs.files(api).withPropertyName("api-${name}") }
    jvmArgumentProviders.add({ ->
        String separator = File.pathSeparator
        ["-Danimus.pluginJar=${distributionJar.get().asFile.absolutePath}".toString(),
         "-Danimus.apiTargets=${apiTargets.collect { String name, Configuration api -> name + '=' + api.files.collect { File file -> file.absolutePath }.join(separator) }.join(';')}".toString()]
    } as CommandLineArgumentProvider)
}
