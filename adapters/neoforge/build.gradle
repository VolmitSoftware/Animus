plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'com.gradleup.shadow' version '9.5.1'
}
apply from: '../../gradle/mod.gradle'

evaluationDependsOn(':core')
neoForge {
    version = targetProperties.neoforge
    mods {
        register(animus.projectId) {
            sourceSet(sourceSets.main)
            sourceSet(project(':core').sourceSets.main)
        }
    }
}
/** The mod-common tests use Brigadier, which only the game classpath provides. */
neoForge.addModdingDependenciesTo(sourceSets.test)
