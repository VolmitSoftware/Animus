plugins {
    id 'java'
}
ext.animusRoot = projectDir.parentFile
apply from: '../gradle/java.gradle'
// The Animus extension for Typewriter. Typewriter loads it from its own extensions folder, so it is never on the Animus
// classpath: the plugin jar carries this jar as a resource and installs it with the extension.json the running Typewriter
// version needs.
repositories {
    maven { url = uri('https://hub.spigotmc.org/nexus/content/repositories/snapshots/') }
    maven {
        url = uri('https://maven.typewritermc.com/beta/')
        content { includeGroup('com.typewritermc') }
    }
}
dependencies {
    compileOnly('org.spigotmc:spigot-api:26.1.2-R0.1-SNAPSHOT')
    compileOnly(project(':animus-bukkit-api'))
    compileOnly('com.typewritermc:engine-paper:0.9.0') { transitive = false }
    compileOnly('com.typewritermc:engine-core:0.9.0') { transitive = false }
    compileOnly('org.jetbrains.kotlin:kotlin-stdlib:2.3.20')
}
tasks.named('jar', Jar).configure { archiveFileName.set('animus-typewriter-extension.jar') }
