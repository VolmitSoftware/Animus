name: Validate and deploy Animus Editor

on:
  pull_request:
    branches:
      - master
    paths:
      - animus-web/**
      - schema/**
      - examples/**
      - .github/workflows/animus-web-firebase-hosting.yml
  push:
    branches:
      - master
    paths:
      - animus-web/**
      - schema/**
      - examples/**
      - .github/workflows/animus-web-firebase-hosting.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCANE_JASPR_REF: 381527a6d62b5fc410b766199a11c67e13f9fa7b
  DART_VERSION: 3.13.5
  FIREBASE_PROJECT_ID: animus-editor
  FIREBASE_TOOLS_VERSION: 15.25.1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MINECRAFT_VERSION: '26.3'
  NODE_VERSION: 22.23.1
  SITE_URL: https://animus.volmitsoftware.com

concurrency:
  group: animus-web-firebase-hosting-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: animus-web

jobs:
  validate:
    name: Analyze, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache pinned Arcane Jaspr
        id: cache-arcane-jaspr
        uses: actions/cache@v5
        with:
          path: animus-web/.deps/arcane_jaspr
          key: animus-web-arcane-jaspr-${{ env.ARCANE_JASPR_REF }}

      - name: Checkout pinned Arcane Jaspr
        if: steps.cache-arcane-jaspr.outputs.cache-hit != 'true'
        uses: actions/checkout@v6
        with:
          repository: TimeZone-LLC/arcane_jaspr
          ref: ${{ env.ARCANE_JASPR_REF }}
          path: animus-web/.deps/arcane_jaspr

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_VERSION }}

      - name: Get editor dependencies
        run: dart pub get --enforce-lockfile

      - name: Analyze editor
        run: dart analyze

      # The client jar is Mojang's and never committed. Both downloads are checked
      # against the sha1 Mojang's version manifest lists for them.
      - name: Extract Minecraft model pack
        run: |
          set -euo pipefail
          manifest="$(curl -fsSL --retry 3 https://piston-meta.mojang.com/mc/game/version_manifest_v2.json)"
          entry="$(jq -r --arg id "$MINECRAFT_VERSION" '.versions[] | select(.id == $id) | "\(.url) \(.sha1)"' <<<"$manifest")"
          if [[ -z "$entry" ]]; then
            echo "::error::Minecraft $MINECRAFT_VERSION is not in Mojang's version manifest."
            exit 1
          fi
          read -r version_url version_sha1 <<<"$entry"
          version_json="$RUNNER_TEMP/minecraft-$MINECRAFT_VERSION.json"
          curl -fsSL --retry 3 -o "$version_json" "$version_url"
          echo "$version_sha1  $version_json" | sha1sum --check --strict -
          client_url="$(jq -er '.downloads.client.url' "$version_json")"
          client_sha1="$(jq -er '.downloads.client.sha1' "$version_json")"
          client_jar="$RUNNER_TEMP/minecraft-$MINECRAFT_VERSION-client.jar"
          curl -fsSL --retry 3 -o "$client_jar" "$client_url"
          echo "$client_sha1  $client_jar" | sha1sum --check --strict -
          dart run tool/extract_minecraft_world_assets.dart --jar="$client_jar" --version="$MINECRAFT_VERSION"
          test -f "web/assets/mc/$MINECRAFT_VERSION/pack.json"

      - name: Test editor
        run: dart test

      - name: Get relay dependencies
        working-directory: animus-web/relay
        run: dart pub get --enforce-lockfile

      - name: Analyze relay
        working-directory: animus-web/relay
        run: dart analyze

      - name: Test relay
        working-directory: animus-web/relay
        run: dart test

      - name: Build editor
        run: dart run jaspr_cli:jaspr build

      - name: Retain verified Hosting build
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: animus-web-hosting
          path: animus-web/build/jaspr/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy verified build
    needs: validate
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://animus.volmitsoftware.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download verified Hosting build
        uses: actions/download-artifact@v4
        with:
          name: animus-web-hosting
          path: animus-web/build/jaspr

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check deployment credential
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANIMUS }}
        run: |
          if [[ -z "$FIREBASE_SERVICE_ACCOUNT" ]]; then
            echo "::error::Set FIREBASE_SERVICE_ACCOUNT_ANIMUS in the Animus repository secrets."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANIMUS }}

      - name: Deploy Firebase Hosting
        run: |
          set -euo pipefail
          unset FIREBASE_TOKEN
          npx --yes "firebase-tools@$FIREBASE_TOOLS_VERSION" deploy \
            --only hosting \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive

      - name: Verify deployed bundle
        run: |
          set -euo pipefail
          expected_sha="$(sha256sum build/jaspr/main.client.dart.js | awk '{print $1}')"
          actual_sha=""
          for attempt in {1..12}; do
            if actual_sha="$(curl -fsS --max-time 30 \
                "$SITE_URL/main.client.dart.js?release=$GITHUB_SHA" \
                | sha256sum | awk '{print $1}')" \
                && [[ "$actual_sha" == "$expected_sha" ]]; then
              echo "Firebase is serving the editor bundle built from $GITHUB_SHA."
              exit 0
            fi
            echo "Waiting for Firebase Hosting to converge (attempt $attempt/12)."
            sleep 5
          done
          echo "::error title=Stale Firebase client bundle::Expected $expected_sha but received $actual_sha."
          exit 1
